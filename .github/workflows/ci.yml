name: Contracts CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contracts-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$install_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$install_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$install_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git --no-banner --redact=100 --log-opts="--all --full-history" .

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Foundry v1.8.5
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.8.5

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          forge --version
          forge --version | grep -F "Version: 1.8.5"

      - name: Check repository and dependency hygiene
        shell: bash
        run: bash script/ci/check-repository-hygiene.sh

      - name: Check formatting of changed Solidity files
        shell: bash
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Leave unrelated baseline formatting out of functional reviews.
          if [[ -z "$FORMAT_BASE" || "$FORMAT_BASE" =~ ^0+$ ]]; then
            forge fmt --check
          else
            git rev-parse --verify "${FORMAT_BASE}^{commit}" >/dev/null
            mapfile -d '' -t files < <(git diff --name-only --diff-filter=ACMR -z "$FORMAT_BASE" HEAD -- '*.sol' ':!lib/**')
            if (( ${#files[@]} )); then
              forge fmt --check "${files[@]}"
            fi
          fi

      - name: Build and enforce EIP-170
        run: forge build src --sizes

      - name: Run unit, fuzz, invariant, and integration tests
        run: forge test --offline

      - name: Run CREATE2 deployment checks
        env:
          FOUNDRY_PROFILE: create2
        run: forge test --offline --match-contract 'DeployAlphaEngineCreate2Test|SetupMainnetCompetitionTest'

      - name: Run coverage
        env:
          # Minimal optimization increases gas for aggregated lifecycle tests.
          FOUNDRY_GAS_LIMIT: "4294967296"
        run: forge coverage --offline --ir-minimum --report summary --skip DeployAlphaEngineV2 --skip DeployAlphaEngineCreate2

      - name: Check ABI and storage-layout snapshots
        shell: bash
        run: bash script/ci/check-generated-artifacts.sh

      - name: Check final tree consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
