name: Contracts Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FOUNDRY_FUZZ_RUNS: 10000
      FOUNDRY_INVARIANT_RUNS: 256
      FOUNDRY_INVARIANT_DEPTH: 128
    steps:
      - name: Checkout pinned candidate and submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Foundry v1.7.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Verify release toolchain
        run: |
          set -euo pipefail
          forge --version | grep -F "Version: 1.7.1"
          solc --version || true

      - name: Check repository and dependency hygiene
        run: bash script/ci/check-repository-hygiene.sh

      - name: Check formatting
        run: forge fmt --check

      - name: Build and enforce EIP-170
        run: forge build --sizes

      - name: Run release test matrix
        run: forge test --offline

      - name: Run release coverage
        run: forge coverage --offline --ir-minimum --report summary

      - name: Reproduce ABI and storage-layout artifacts
        run: bash script/ci/check-generated-artifacts.sh

      - name: Require persistent internal audit evidence
        run: |
          test -n "$(find assets/findings -maxdepth 1 -type f -name '*audit-report-*.md' -print -quit)"

      - name: Check frozen tree consistency
        run: |
          git diff --check
          git diff --exit-code
